name: Altcoin Risk Bot

on:
  schedule:
    # каждый час в 30 минут (время UTC) - сдвинуто относительно coin bot, чтобы не совпадали
    - cron: "30 * * * *"
  workflow_dispatch: {}

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Run bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TOKEN_ADDRESS: "0x39dBED3a2bd333467115dE45665cC57F813C4571"
          CHAIN_ID: "999999"
          TOKEN_SYMBOL: "PONS"
          DERIV_SYMBOL: ""
          DERIV_EXCHANGE: ""
          COIN_ID: ""
        run: python altcoin_risk_bot.py
